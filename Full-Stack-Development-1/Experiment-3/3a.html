<!DOCTYPE html>
<html>
<head>
    <title>HTML Semantic Elements</title>
    <style>
    body { 
            font-family: Arial; 
            margin: 0; 
            }
        header { 
            background-color: lightblue; 
            text-align: center; 
            padding: 20px; 
        }
        nav { 
            background-color: black; 
            text-align: center; 
            padding: 10px; 
            }
        nav a { 
            color: white; 
            text-decoration: none; 
            margin: 15px; 
            }
        main { 
            padding: 20px; 
            }
        section { 
            background-color: lightgreen; 
            padding: 15px; 
            margin-bottom: 15px; 
            }
        div { 
            background-color: lightyellow; 
            padding: 15px; 
            }
        span { 
            color: red; 
            font-weight: bold; 
            }
        footer { 
            background-color: lightgray; 
            text-align: center; 
            padding: 15px; 
            }
        </style>


</head>

<body>

<header>
    <h1>Student Information Portal</h1>
</header>

<nav>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Courses</a> |
    <a href="#">Contact</a>
</nav>

<main>

    <section>
        <h2>About Students</h2>

        <div>
            <p>
                Students can learn different subjects and develop
                <span>technical skills</span> through education.
            </p>
        </div>
    </section>

    <section>
        <h2>Courses</h2>

        <div>
            <p>B.Tech</p>
            <p>BCA</p>
            <p>MCA</p>
        </div>
    </section>

</main>

<footer>
    <p>Copyright 2026 Student Portal</p>
</footer>

</body>
</html>
