<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks Example</title>
</head>

<body>

    <h1>HTML Hyperlinks</h1>

    <h2>1. Open in Same Tab</h2>
    <a href="https://www.google.com" target="_self">
        Open Google
    </a>

    <h2>2. Open in New Tab</h2>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube
    </a>

    <h2>3. Open College Website</h2>
    <a href="https://www.sasi.ac.in" target="_blank">
        Visit SASI College
    </a>

</body>
</html>
