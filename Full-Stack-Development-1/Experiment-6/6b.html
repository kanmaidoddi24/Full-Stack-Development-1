<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>
<body>
    <h2>JavaScript Output Methods</h2>
    <p id="result"></p>
    <script>
        document.write("Hello using document.write()<br>");

        alert("Hello using alert()");

        document.getElementById("result").innerHTML ="Hello using innerHTML";

        console.log("Hello using console.log()");

    </script>
</body>
</html>
