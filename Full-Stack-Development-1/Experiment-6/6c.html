<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Input Methods</title>
</head>
<body>
<h2>JavaScript Input Methods</h2>
<script>
    let name = prompt("Enter your name:");
    let age = prompt("Enter your age:");
    document.write("Name: " + name + "<br>");
    document.write("Age: " + age);
</script>
</body>
</html>
