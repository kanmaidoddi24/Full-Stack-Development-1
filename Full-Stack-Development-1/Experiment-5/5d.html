<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        .box {
            width: 300px;
            background-color: lightblue;
            padding: 20px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 30px;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is the content area of the box.
    </div>

</body>
</html>
